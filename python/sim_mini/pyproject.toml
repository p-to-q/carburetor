[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carburetor-sim-mini"
version = "0.1.0"
description = "carburetor — python prototype counterpart to packages/sim/"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
  { name = "wooden computer co., ltd." }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "mypy>=1.9",
  "ruff>=0.3",
]

[project.urls]
homepage = "https://carburetor.wtf"
repository = "https://github.com/p-to-q/carburetor"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
