name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.11.1
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./python/sim_mini[dev]"

      - name: Format check (TS/JSON/MD)
        run: pnpm format:check

      - name: Build simulator package
        run: pnpm --filter @carburetor/sim build

      - name: TypeScript simulator tests
        run: pnpm sim:test

      - name: Browser bundle
        run: pnpm bundle:browser

      - name: Golden fixture manifest check
        run: pnpm golden:check

      - name: Edizione build
        run: pnpm edizione:build

      - name: Python tests (pytest)
        working-directory: python/sim_mini
        run: pytest -v

      - name: Python lint (ruff)
        working-directory: python/sim_mini
        run: ruff check .

      - name: Python type check (mypy)
        working-directory: python/sim_mini
        run: mypy .
