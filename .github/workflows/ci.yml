name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20.11.1
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Build simulator package
        run: pnpm --filter @carburetor/sim build

      - name: Simulator test placeholder
        run: pnpm sim:test

      - name: Golden fixture manifest check
        run: pnpm golden:check

      - name: Edizione build
        run: pnpm edizione:build

      - name: Python import smoke
        run: python -c "import sys; sys.path.insert(0, 'python'); import sim_mini; print(sim_mini.__version__)"
