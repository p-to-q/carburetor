version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    groups:
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 2
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    groups:
      github-actions:
        update-types:
          - 'minor'
          - 'patch'
